<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Commands - Astrabot Dashboard</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #1e1f22; color: #e3e5e8; margin: 0; padding: 32px; }
        .wrap { max-width: 880px; margin: 0 auto; }
        h1 { font-size: 20px; }
        nav a { color: #949ba4; text-decoration: none; margin-right: 16px; }
        nav a.active { color: #e3e5e8; font-weight: 600; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { text-align: left; padding: 10px 12px; border-bottom: 1px solid #3a3c42; font-size: 14px; }
        th { color: #949ba4; font-weight: 600; text-transform: uppercase; font-size: 11px; }
        input[type=text] { width: 100%; box-sizing: border-box; padding: 6px 8px; border-radius: 4px; border: 1px solid #1e1f22; background: #1e1f22; color: #e3e5e8; }
        input[type=checkbox] { width: 18px; height: 18px; }
        button { padding: 8px 18px; border-radius: 4px; border: none; background: #5865f2; color: white; font-weight: 600; cursor: pointer; }
        button:hover { background: #4752c4; }
        .cmd-name { font-family: monospace; }
        .actions { margin-top: 16px; }
    </style>
</head>
<body>
<div class="wrap">
    <h1>Astrabot Dashboard &middot; <span th:text="${guildId}">guildId</span></h1>
    <nav>
        <a class="active" th:href="@{/dashboard/{id}/commands(id=${guildId})}">Commands</a>
        <a th:href="@{/dashboard/{id}/rules(id=${guildId})}">Rules</a>
    </nav>

    <form th:action="@{/dashboard/{id}/commands(id=${guildId})}" th:object="${form}" method="post">
        <table>
            <thead>
            <tr>
                <th>Command</th>
                <th>Enabled</th>
                <th>Mirror</th>
                <th>AI</th>
                <th>Ephemeral</th>
                <th>Reply template</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="config, iter : *{configs}">
                <td class="cmd-name" th:text="'/' + ${config.commandName}">/command</td>
                <td>
                    <input type="hidden" th:field="*{configs[__${iter.index}__].commandName}" />
                    <input type="checkbox" th:field="*{configs[__${iter.index}__].enabled}" />
                </td>
                <td><input type="checkbox" th:field="*{configs[__${iter.index}__].mirrorEnabled}" /></td>
                <td><input type="checkbox" th:field="*{configs[__${iter.index}__].aiEnabled}" /></td>
                <td><input type="checkbox" th:field="*{configs[__${iter.index}__].ephemeral}" /></td>
                <td><input type="text" th:field="*{configs[__${iter.index}__].replyTemplate}" placeholder="(default)" /></td>
            </tr>
            </tbody>
        </table>
        <div class="actions">
            <button type="submit">Save all changes</button>
        </div>
    </form>
</div>
</body>
</html>
