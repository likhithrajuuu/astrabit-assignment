<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Server not found - Astrabot Dashboard</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #1e1f22; color: #e3e5e8; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; }
        .card { background: #2b2d31; padding: 32px; border-radius: 8px; width: 420px; text-align: center; }
        code { background: #1e1f22; padding: 2px 6px; border-radius: 4px; }
        a { color: #949ba4; }
    </style>
</head>
<body>
<div class="card">
    <h1>This server hasn't connected yet</h1>
    <p>No guild with ID <code th:text="${guildId}">guildId</code> has run a command with Astrabot yet.
       Run any command (e.g. <code>/ping</code>) in that Discord server first, then reload this page.</p>
    <p><a th:href="@{/dashboard}">&larr; back</a></p>
</div>
</body>
</html>
